name: Validate and Audit Ice Map

on:
  push:
    branches: [main]

  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ice-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate published network
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate network
        run: npm run validate

  audit:
    name: Validate and generate PR audit
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch proposed network
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"

          git show "$HEAD_SHA:data/network.v1.json" \
            > /tmp/network-proposed.json

          cp data/network.v1.json /tmp/network-base.json
          cp data/audit.v1.jsonl /tmp/audit-base.jsonl

      - name: Validate proposed network
        run: |
          node scripts/validate.mjs \
            /tmp/network-proposed.json

      - name: Generate audit
        run: |
          node scripts/audit.mjs \
            /tmp/network-base.json \
            /tmp/network-proposed.json \
            /tmp/audit-base.jsonl \
            /tmp/audit-generated.jsonl

      - name: Commit generated audit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout --detach "$HEAD_SHA"

          cp /tmp/audit-generated.jsonl data/audit.v1.jsonl

          if git diff --quiet -- data/audit.v1.jsonl; then
            echo "Audit already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/audit.v1.jsonl
          git commit -m "chore: update network audit"

          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
